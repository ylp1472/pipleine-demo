name: Docker Image CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        run: echo '$Y4^a#3.YZ;s>AY' | docker login -u bamunubamunu --password-stdin

      - name: Build the Docker image
        run: docker build -t bamunubamunu/coursework-group_95:latest .

      - name: Push to DockerHub
        run: docker push bamunubamunu/coursework-group_95:latest
