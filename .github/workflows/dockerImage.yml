name: Docker Image CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        env:
          DOCKER_USERNAME: Kbamunuarachchi0331
          DOCKER_PASSWORD: "$Y4^a#3.YZ;s>AY"
        run: echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin

      - name: Build the Docker image
        run: docker build -t coursework-group_95:latest .

      - name: Push to DockerHub
        run: docker push Kbamunuarachchi0331/coursework-group_95:latest
