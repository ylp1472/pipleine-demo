name: Docker Image CI 
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Login DockerHub
      run: docker login -u bamunubamunu -p ,'bamunubamunuA2@'
    - name: Build the Docker image
      run: docker build -t bamunubamunu/coursework-group_95:latest .  
    - name: Push to DockerHub
      run: docker push bamunubamunu/coursework-group_95:latest
      
